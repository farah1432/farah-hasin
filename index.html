*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0a0c0f;--bg2:#0f1217;--bg3:#151a22;
  --border:#1e2530;--accent:#00e5a0;--accent2:#0077ff;
  --text:#e8edf5;--muted:#6b7a8d;--dim:#3a4553;
  --mono:'JetBrains Mono',monospace;--sans:'Syne',sans-serif;
  --card-bg:#0f1217;--input-bg:#151a22;
  --transition:0.3s cubic-bezier(0.4,0,0.2,1);
}
[data-theme="light"]{
  --bg:#f4f6f9;--bg2:#ffffff;--bg3:#eef0f4;
  --border:#dde2ea;--accent:#009e6e;--accent2:#0055cc;
  --text:#0f1520;--muted:#5a6a7e;--dim:#9aa5b4;
  --card-bg:#ffffff;--input-bg:#f4f6f9;
}
html{scroll-behavior:smooth;}
body{font-family:var(--sans);background:var(--bg);color:var(--text);transition:background var(--transition),color var(--transition);min-height:100vh;}
::selection{background:var(--accent);color:#000;}
::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--dim);border-radius:3px;}

@keyframes fadeUp{from{opacity:0;transform:translateY(28px);}to{opacity:1;transform:translateY(0);}}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes blink{50%{opacity:0;}}
@keyframes glow{0%,100%{box-shadow:0 0 0 rgba(0,229,160,0);}50%{box-shadow:0 0 20px rgba(0,229,160,0.22);}}
@keyframes photoReveal{from{opacity:0;transform:scale(0.92);}to{opacity:1;transform:scale(1);}}
@keyframes ringPulse{0%,100%{box-shadow:0 0 0 0 rgba(0,229,160,0.35);}50%{box-shadow:0 0 0 8px rgba(0,229,160,0);}}

.observe-fade{opacity:0;transform:translateY(24px);transition:opacity 0.6s ease,transform 0.6s ease;}
.observe-fade.visible{opacity:1;transform:translateY(0);}

.app-wrapper{max-width:960px;margin:0 auto;padding:0 1.5rem 5rem;}

.top-bar{
  position:sticky;top:0;z-index:100;
  display:flex;align-items:center;justify-content:space-between;
  padding:0.9rem 1.5rem;
  background:var(--bg);border-bottom:1px solid var(--border);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  transition:background var(--transition);
}
.logo{font-family:var(--mono);font-size:12px;color:var(--accent);letter-spacing:0.05em;}
.top-actions{display:flex;gap:8px;align-items:center;}
.icon-btn{
  background:var(--bg3);border:1px solid var(--border);border-radius:6px;
  padding:7px 13px;font-family:var(--mono);font-size:11px;color:var(--muted);
  cursor:pointer;transition:all 0.2s;letter-spacing:0.05em;
  text-decoration:none;display:inline-flex;align-items:center;gap:6px;
}
.icon-btn:hover{border-color:var(--accent);color:var(--accent);}
.icon-btn.accent{background:var(--accent);color:#000;border-color:var(--accent);font-weight:700;}
.icon-btn.accent:hover{opacity:0.88;transform:translateY(-1px);}

/* Hero */
.terminal-wrap{margin-top:2.5rem;}
.term-bar{

  border-radius:10px 10px 0 0;padding:10px 16px;
  font-family:var(--mono);font-size:11px;color:var(--muted);
}
.dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;}
.dot.r{background:#ff5f57;}.dot.y{background:#febc2e;}.dot.g{background:#28c840;}

.hero{

  border-radius:0 0 10px 10px;padding:3rem 2.5rem;
  position:relative;overflow:hidden;
}
.hero-glow{
  position:absolute;top:-80px;right:-80px;width:420px;height:420px;
  background:radial-gradient(circle,rgba(0,229,160,0.06) 0%,transparent 70%);
  pointer-events:none;
}
[data-theme="light"] .hero-glow{background:radial-gradient(circle,rgba(0,158,110,0.07) 0%,transparent 70%);}

.hero-inner{display:flex;gap:2.5rem;align-items:flex-start;}
.hero-photo-col{flex-shrink:0;}
.hero-photo-wrap{

.hero-photo{width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:center top;display:block;}
.hero-content{flex:1;min-width:0;}

// Intersection Observer hook for scroll animations
function useScrollReveal() {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const obs = new IntersectionObserver(([entry]) => {
      if (entry.isIntersecting) { el.classList.add('visible'); obs.disconnect(); }
    }, { threshold: 0.12 });
    obs.observe(el);
    return () => obs.disconnect();
  }, []);
  return ref;
}

function FadeSection({ children, delay = 0 }) {
  const ref = useScrollReveal();
  return <div ref={ref} className="observe-fade" style={{ transitionDelay: `${delay}s` }}>{children}</div>;
}

function TypeWriter({ text, delay = 38 }) {
  const [displayed, setDisplayed] = useState("");
  useEffect(() => {
    let i = 0;
    const id = setInterval(() => {
      setDisplayed(text.slice(0, ++i));
      if (i >= text.length) clearInterval(id);
    }, delay);
    return () => clearInterval(id);
  }, [text]);
  return <span>{displayed}<span className="cursor"/></span>;
}

                  <span className="cpill">↗ Dallas, TX</span>
                  <a className="cpill" href="https://www.linkedin.com/in/farah-hasin-8ba6ab3b" target="_blank" rel="noreferrer">in LinkedIn</a>
                  <a className="cpill" href="https://www.researchgate.net/profile/Farah-Hasin" target="_blank" rel="noreferrer">rg ResearchGate</a>
                </div>
              </div>
            </div>
          </div>
        </div>

        {/* Stats */}
        <FadeSection delay={0.1}>
          <div className="stats-row">
            {[["18+","years experience"],["83M+","subscribers served"],["3,000+","sites integrated"],["3","IEEE/Springer papers"]].map(([n,l]) => (
              <div className="stat-card" key={l}>
                <div className="stat-num">{n}</div>
                <div className="stat-lbl">{l}</div>
              </div>
            ))}
          </div>
        </FadeSection>

        {/* Nav */}
        <FadeSection delay={0.15}>
          <div className="nav">
            {TABS.map(t => (
              <button key={t} className={`nav-tab${tab===t?" active":""}`} onClick={()=>setTab(t)}>{t}</button>
            ))}
          </div>
        </FadeSection>

        {/* Tab Content */}
        <FadeSection delay={0.05} key={tab}>
          <div className="section-wrap">

            {tab === "experience" && <>
              <div className="sec-label">// work history</div>
              <div className="exp-list">
                {DATA.experience.map((e,i) => (
                  <FadeSection key={i} delay={i*0.08}>
                    <div className="exp-item">
                      <div className="exp-date">{e.date}</div>
                      <div className="exp-title">{e.title}</div>
                      <div className="exp-co">{e.company}</div>
                      <div className="exp-desc">{e.desc}</div>
                    </div>
                  </FadeSection>
                ))}
              </div>
            </>}

            {tab === "skills" && <>
              <div className="sec-label">// technical skills</div>
              <div className="skills-grid">
                {DATA.skills.map((s,i) => (
                  <FadeSection key={i} delay={i*0.07}>
                    <div className="skill-card">
                      <div className="skill-cat">{s.cat}</div>
                      <div className="tags">{s.tags.map(t=><span className="tag" key={t}>{t}</span>)}</div>
                    </div>
                  </FadeSection>
                ))}
              </div>
            </>}

            {tab === "projects" && <>
              <div className="sec-label">// selected projects</div>
              <div className="proj-grid">
                {DATA.projects.map((p,i) => (
                  <FadeSection key={i} delay={i*0.07}>
                    <div className="proj-card">
                      <div className="proj-num">{p.num}</div>
                      <div className="proj-title">{p.title}</div>
                      <div className="proj-desc">{p.desc}</div>
                    </div>
                  </FadeSection>
                ))}
              </div>
            </>}

            {tab === "research" && <>
              <div className="sec-label">// publications</div>
              {DATA.pubs.map((p,i) => (
                <FadeSection key={i} delay={i*0.1}>
                  <div className="pub-item">
                    <div className="pub-pub">{p.pub}</div>
                    <a className="pub-title" href={p.url} target="_blank" rel="noreferrer" style={{textDecoration:'none',color:'inherit',cursor:'pointer'}}
                      onMouseEnter={e=>e.currentTarget.style.color='var(--accent)'}
                      onMouseLeave={e=>e.currentTarget.style.color='inherit'}>
                      {p.title} <span style={{fontSize:'10px',opacity:0.5}}>↗</span>
                    </a>
                    <a className="pub-doi" href={p.url} target="_blank" rel="noreferrer" style={{textDecoration:'none',display:'block',marginTop:'4px'}}
                      onMouseEnter={e=>e.currentTarget.style.color='var(--accent)'}
                      onMouseLeave={e=>e.currentTarget.style.color='var(--dim)'}>
                      {p.doi}
                    </a>
                  </div>
                </FadeSection>
              ))}
              <div className="sec-label" style={{marginTop:"2rem"}}>// education</div>
              <div className="exp-list">
                {[
                  {date:"2021 · CGPA 3.96/4.00",title:"M.Sc. Information Systems Security",company:"Bangladesh University of Professionals",desc:"Thesis: Application of Blockchain in Aviation Cybersecurity and ADS-B Threat Mitigation."},
                  {date:"2006 · CGPA 3.3/4.00",title:"B.Sc. Computer Science & Engineering",company:"University of Asia Pacific",desc:"Thesis: Development of Human–Robot Systems for Automated Surveillance and Navigation."},
                ].map((e,i) => (
                  <FadeSection key={i} delay={i*0.1}>
                    <div className="exp-item">
                      <div className="exp-date">{e.date}</div>
                      <div className="exp-title">{e.title}</div>
                      <div className="exp-co">{e.company}</div>
                      <div className="exp-desc">{e.desc}</div>
                    </div>
                  </FadeSection>
                ))}
              </div>
            </>}

            {tab === "awards" && <>
              <div className="sec-label">// awards & recognition</div>
              {DATA.awards.map((a,i) => (
                <FadeSection key={i} delay={i*0.08}>
                  <div className="award-item"><span className="aw-mark">★</span>{a}</div>
                </FadeSection>
              ))}
              <div className="sec-label" style={{marginTop:"2rem"}}>// certifications</div>
              <div className="cert-grid">
                {DATA.certs.map((c,i) => (
                  <FadeSection key={i} delay={i*0.07}>
                    <div className="cert-item">{c.name}<div className="cert-year">{c.year}</div></div>
                  </FadeSection>
                ))}
              </div>
            </>}

            {tab === "contact" && <>
              <div className="sec-label">// get in touch</div>
              <ContactForm/>
            </>}

          </div>
        </FadeSection>

        <div className="footer">
          built with React · farah hasin © 2025 · dallas, tx
        </div>
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
