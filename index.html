<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="description" content="Farah Hasin — Telecommunication Engineer & Cybersecurity Specialist with 18+ years of experience."/>
<title>Farah Hasin — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Syne:wght@400;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0a0c0f;--bg2:#0f1217;--bg3:#151a22;
  --border:#1e2530;--accent:#00e5a0;--accent2:#0077ff;
  --text:#e8edf5;--muted:#6b7a8d;--dim:#3a4553;
  --mono:'JetBrains Mono',monospace;--sans:'Syne',sans-serif;
  --card-bg:#0f1217;--input-bg:#151a22;
  --transition:0.3s cubic-bezier(0.4,0,0.2,1);
}
[data-theme="light"]{
  --bg:#f4f6f9;--bg2:#ffffff;--bg3:#eef0f4;
  --border:#dde2ea;--accent:#009e6e;--accent2:#0055cc;
  --text:#0f1520;--muted:#5a6a7e;--dim:#9aa5b4;
  --card-bg:#ffffff;--input-bg:#f4f6f9;
}
html{scroll-behavior:smooth;}
body{font-family:var(--sans);background:var(--bg);color:var(--text);transition:background var(--transition),color var(--transition);min-height:100vh;}
::selection{background:var(--accent);color:#000;}
::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--dim);border-radius:3px;}

@keyframes fadeUp{from{opacity:0;transform:translateY(28px);}to{opacity:1;transform:translateY(0);}}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes blink{50%{opacity:0;}}
@keyframes glow{0%,100%{box-shadow:0 0 0 rgba(0,229,160,0);}50%{box-shadow:0 0 20px rgba(0,229,160,0.22);}}
@keyframes photoReveal{from{opacity:0;transform:scale(0.92);}to{opacity:1;transform:scale(1);}}
@keyframes ringPulse{0%,100%{box-shadow:0 0 0 0 rgba(0,229,160,0.35);}50%{box-shadow:0 0 0 8px rgba(0,229,160,0);}}

.observe-fade{opacity:0;transform:translateY(24px);transition:opacity 0.6s ease,transform 0.6s ease;}
.observe-fade.visible{opacity:1;transform:translateY(0);}

.app-wrapper{max-width:960px;margin:0 auto;padding:0 1.5rem 5rem;}

.top-bar{
  position:sticky;top:0;z-index:100;
  display:flex;align-items:center;justify-content:space-between;
  padding:0.9rem 1.5rem;
  background:var(--bg);border-bottom:1px solid var(--border);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  transition:background var(--transition);
}
.logo{font-family:var(--mono);font-size:12px;color:var(--accent);letter-spacing:0.05em;}
.top-actions{display:flex;gap:8px;align-items:center;}
.icon-btn{
  background:var(--bg3);border:1px solid var(--border);border-radius:6px;
  padding:7px 13px;font-family:var(--mono);font-size:11px;color:var(--muted);
  cursor:pointer;transition:all 0.2s;letter-spacing:0.05em;
  text-decoration:none;display:inline-flex;align-items:center;gap:6px;
}
.icon-btn:hover{border-color:var(--accent);color:var(--accent);}
.icon-btn.accent{background:var(--accent);color:#000;border-color:var(--accent);font-weight:700;}
.icon-btn.accent:hover{opacity:0.88;transform:translateY(-1px);}

/* Hero */
.terminal-wrap{margin-top:2.5rem;}
.term-bar{
  display:flex;align-items:center;gap:8px;
  background:var(--bg3);border:1px solid var(--border);
  border-radius:10px 10px 0 0;padding:10px 16px;
  font-family:var(--mono);font-size:11px;color:var(--muted);
}
.dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;}
.dot.r{background:#ff5f57;}.dot.y{background:#febc2e;}.dot.g{background:#28c840;}

.hero{
  background:var(--bg2);border:1px solid var(--border);border-top:none;
  border-radius:0 0 10px 10px;padding:3rem 2.5rem;
  position:relative;overflow:hidden;
}
.hero-glow{
  position:absolute;top:-80px;right:-80px;width:420px;height:420px;
  background:radial-gradient(circle,rgba(0,229,160,0.06) 0%,transparent 70%);
  pointer-events:none;
}
[data-theme="light"] .hero-glow{background:radial-gradient(circle,rgba(0,158,110,0.07) 0%,transparent 70%);}

.hero-inner{display:flex;gap:2.5rem;align-items:flex-start;}
.hero-photo-col{flex-shrink:0;}
.hero-photo-wrap{
  width:140px;height:140px;border-radius:50%;
  border:2px solid var(--accent);padding:3px;
  animation:photoReveal 0.8s ease both 0.2s, ringPulse 3s ease 1.5s infinite;
  background:var(--bg3);
}
.hero-photo{width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:center top;display:block;}
.hero-content{flex:1;min-width:0;}
.hero-tag{
  font-family:var(--mono);font-size:11px;color:var(--accent);
  letter-spacing:0.15em;text-transform:uppercase;
  margin-bottom:0.75rem;display:flex;align-items:center;gap:8px;
}
.hero-tag::before{content:'//';color:var(--dim);}
.hero-name{font-size:clamp(1.6rem,3.5vw,2.4rem);font-weight:700;line-height:1.1;letter-spacing:-0.03em;font-family:'Space Grotesk',var(--sans);}
.hero-name .hl{color:var(--accent);}
.hero-role{font-family:var(--mono);font-size:13px;color:var(--muted);margin:0.65rem 0 1.25rem;}
.cursor{display:inline-block;width:2px;height:13px;background:var(--accent);margin-left:2px;animation:blink 1.1s step-end infinite;vertical-align:middle;}
.hero-bio{font-size:14px;line-height:1.75;color:var(--muted);max-width:600px;}
.contact-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:1.5rem;}
.cpill{
  font-family:var(--mono);font-size:11px;
  border:1px solid var(--border);border-radius:4px;
  padding:5px 11px;color:var(--muted);
  text-decoration:none;transition:all 0.2s;
  display:flex;align-items:center;gap:5px;background:var(--bg3);
}
.cpill:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px);}

/* Stats */
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:2rem 0;}
.stat-card{
  background:var(--bg2);border:1px solid var(--border);border-radius:8px;
  padding:1rem;text-align:center;transition:border-color 0.2s,transform 0.2s;
  cursor:default;
}
.stat-card:hover{border-color:var(--accent);transform:translateY(-3px);animation:glow 2s ease infinite;}
.stat-num{font-size:1.75rem;font-weight:800;color:var(--accent);font-family:var(--mono);}
.stat-lbl{font-size:11px;color:var(--muted);margin-top:4px;letter-spacing:0.04em;}

/* Nav */
.nav{
  display:flex;border-bottom:1px solid var(--border);
  font-family:var(--mono);font-size:12px;
  overflow-x:auto;scrollbar-width:none;margin-top:2rem;
}
.nav::-webkit-scrollbar{display:none;}
.nav-tab{
  padding:10px 18px;color:var(--muted);cursor:pointer;white-space:nowrap;
  border-bottom:2px solid transparent;transition:all 0.2s;
  background:none;border-top:none;border-left:none;border-right:none;
  font-family:var(--mono);font-size:12px;
}
.nav-tab:hover{color:var(--text);}
.nav-tab.active{color:var(--accent);border-bottom-color:var(--accent);}

.section-wrap{margin-top:2.5rem;}
.sec-label{font-family:var(--mono);font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:var(--dim);margin-bottom:1.5rem;}

/* Experience */
.exp-list{border-left:1px solid var(--border);padding-left:2rem;}
.exp-item{margin-bottom:2.5rem;position:relative;}
.exp-item::before{
  content:'';position:absolute;left:-2.35rem;top:5px;
  width:8px;height:8px;border-radius:50%;
  background:var(--bg);border:1.5px solid var(--accent);
}
.exp-date{font-family:var(--mono);font-size:11px;color:var(--muted);margin-bottom:3px;}
.exp-title{font-size:15px;font-weight:700;color:var(--text);}
.exp-co{font-family:var(--mono);font-size:12px;color:var(--accent);margin:2px 0 8px;}
.exp-desc{font-size:13px;line-height:1.7;color:var(--muted);}

/* Skills */
.skills-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;}
.skill-card{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:1rem;transition:border-color 0.2s;}
.skill-card:hover{border-color:var(--accent);}
.skill-cat{font-family:var(--mono);font-size:10px;letter-spacing:0.15em;text-transform:uppercase;color:var(--accent);margin-bottom:8px;}
.tags{display:flex;flex-wrap:wrap;gap:6px;}
.tag{font-family:var(--mono);font-size:11px;background:var(--bg3);border:1px solid var(--border);border-radius:3px;padding:3px 8px;color:var(--muted);transition:all 0.15s;}
.tag:hover{border-color:var(--accent);color:var(--accent);}

/* Projects */
.proj-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px;}
.proj-card{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:1.25rem;transition:all 0.2s;}
.proj-card:hover{border-color:var(--accent);transform:translateY(-3px);}
.proj-num{font-family:var(--mono);font-size:10px;color:var(--dim);margin-bottom:6px;}
.proj-title{font-size:14px;font-weight:700;color:var(--text);margin-bottom:6px;line-height:1.35;}
.proj-desc{font-size:12px;line-height:1.65;color:var(--muted);}

/* Research */
.pub-item{border-left:2px solid var(--border);padding:0 0 0 1rem;margin-bottom:1.5rem;transition:border-color 0.2s;}
.pub-item:hover{border-color:var(--accent);}
.pub-pub{font-family:var(--mono);font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--accent);margin-bottom:4px;}
.pub-title{font-size:13px;line-height:1.55;color:var(--text);margin-bottom:4px;}
.pub-doi{font-family:var(--mono);font-size:10px;color:var(--dim);}

/* Awards */
.award-item{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px;color:var(--muted);}
.award-item:last-child{border-bottom:none;}
.aw-mark{font-family:var(--mono);font-size:10px;color:var(--accent);padding-top:2px;flex-shrink:0;}
.cert-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:1.5rem;}
.cert-item{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:12px;font-size:12px;color:var(--muted);line-height:1.5;transition:border-color 0.2s;}
.cert-item:hover{border-color:var(--accent);}
.cert-year{font-family:var(--mono);font-size:10px;color:var(--dim);margin-top:4px;}

/* Contact */
.contact-wrap{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:2rem;max-width:560px;}
.form-row{margin-bottom:1rem;}
.form-label{font-family:var(--mono);font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:6px;}
.form-input,.form-textarea{
  width:100%;background:var(--input-bg);border:1px solid var(--border);
  border-radius:6px;padding:10px 14px;color:var(--text);
  font-family:var(--sans);font-size:14px;outline:none;
  transition:border-color 0.2s;resize:vertical;
}
.form-input:focus,.form-textarea:focus{border-color:var(--accent);}
.form-textarea{min-height:110px;}
.submit-btn{
  background:var(--accent);color:#000;border:none;border-radius:6px;
  padding:11px 24px;font-family:var(--mono);font-size:12px;font-weight:700;
  letter-spacing:0.08em;cursor:pointer;transition:all 0.2s;margin-top:0.5rem;
}
.submit-btn:hover{opacity:0.88;transform:translateY(-1px);}
.form-success{
  background:rgba(0,229,160,0.08);border:1px solid var(--accent);
  border-radius:6px;padding:1rem;font-family:var(--mono);font-size:13px;
  color:var(--accent);margin-top:1rem;text-align:center;
}

.footer{
  text-align:center;padding:3rem 0 1rem;
  font-family:var(--mono);font-size:11px;color:var(--dim);
  border-top:1px solid var(--border);margin-top:3rem;
}

@media(max-width:620px){
  .hero-inner{flex-direction:column;gap:1.5rem;}
  .hero-photo-wrap{width:110px;height:110px;}
  .hero{padding:2rem 1.25rem;}
  .app-wrapper{padding:0 1rem 4rem;}
  .hero-name{font-size:2.2rem;}
}
</style>

// Intersection Observer hook for scroll animations
function useScrollReveal() {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const obs = new IntersectionObserver(([entry]) => {
      if (entry.isIntersecting) { el.classList.add('visible'); obs.disconnect(); }
    }, { threshold: 0.12 });
    obs.observe(el);
    return () => obs.disconnect();
  }, []);
  return ref;
}

function FadeSection({ children, delay = 0 }) {
  const ref = useScrollReveal();
  return <div ref={ref} className="observe-fade" style={{ transitionDelay: `${delay}s` }}>{children}</div>;
}

function TypeWriter({ text, delay = 38 }) {
  const [displayed, setDisplayed] = useState("");
  useEffect(() => {
    let i = 0;
    const id = setInterval(() => {
      setDisplayed(text.slice(0, ++i));
      if (i >= text.length) clearInterval(id);
    }, delay);
    return () => clearInterval(id);
  }, [text]);
  return <span>{displayed}<span className="cursor"/></span>;
}

function ContactForm() {
  const [form, setForm] = useState({ name:"", email:"", message:"" });
  const [sent, setSent] = useState(false);
  const handle = e => setForm(f => ({...f, [e.target.name]: e.target.value}));
  const submit = e => {
    e.preventDefault();
    if (!form.name || !form.email || !form.message) return;
    setSent(true);
  };
  if (sent) return (
    <div className="contact-wrap">
      <div className="form-success">✓ Message received! Farah will get back to you shortly.</div>
    </div>
  );
  return (
    <div className="contact-wrap">
      <form onSubmit={submit}>
        <div className="form-row">
          <label className="form-label">name</label>
          <input className="form-input" name="name" value={form.name} onChange={handle} placeholder="Your name" required/>
        </div>
        <div className="form-row">
          <label className="form-label">email</label>
          <input className="form-input" name="email" type="email" value={form.email} onChange={handle} placeholder="your@email.com" required/>
        </div>
        <div className="form-row">
          <label className="form-label">message</label>
          <textarea className="form-textarea" name="message" value={form.message} onChange={handle} placeholder="What's on your mind?" required/>
        </div>
        <button className="submit-btn" type="submit">send_message() →</button>
      </form>
    </div>
  );
}
